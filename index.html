<!DOCTYPE html>
<html>
<head>
    <title>AI Study Planner</title>
</head>

<body>

    <h1>📚 AI Study Planner</h1>

    <p>Enter a subject you want to study:</p>

    <input type="text" id="subject" placeholder="Example: Java">

    <button onclick="createPlan()">Create Study Plan</button>

    <h2>Your Study Plan</h2>

    <p id="result"></p>

    <script>
        function createPlan() {
            let subject = document.getElementById("subject").value;

            if (subject === "") {
                document.getElementById("result").innerText =
                    "Please enter a subject.";
            } else {
                document.getElementById("result").innerText =
                    "Study " + subject +
                    " for 2 hours: Learn → Practice → Revise → Test yourself.";
            }
        }
    </script>

</body>
</html>
